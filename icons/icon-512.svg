<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Warehouse / Layer Structure -->
  <g filter="url(#glow)">
    <!-- Base Platform -->
    <path d="M96 360 L256 424 L416 360 L256 296 Z" fill="url(#blueGrad)" opacity="0.9"/>
    
    <!-- Mid Layer -->
    <path d="M96 280 L256 344 L416 280 L256 216 Z" fill="url(#blueGrad)" opacity="0.75"/>
    
    <!-- Top Cube / Tool Symbol -->
    <path d="M160 190 L256 230 L352 190 L256 150 Z" fill="url(#accentGrad)"/>
    <path d="M160 190 L256 230 L256 290 L160 250 Z" fill="#b45309"/>
    <path d="M256 230 L352 190 L352 250 L256 290 Z" fill="#d97706"/>
  </g>

  <!-- WMS Text -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">WMS ARENDA</text>
</svg>
